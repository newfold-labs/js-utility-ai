version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    allow:
      - dependency-type: direct
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "GitHub Actions"
      include: "scope"
    labels:
      - "dependencies"
      - "workflows"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    allow:
      - dependency-type: direct
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "NPM"
      prefix-development: "NPM Dev"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
